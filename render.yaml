# Render Blueprint configuration for MedNova Backend deployment
services:
  - type: web
    name: mednova-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_CONNECTION_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: FCM_PROJECT_ID
        value: "mednova-fcm"
      - key: FCM_CREDENTIALS_PATH
        sync: false
      - key: AI_MODEL_PATH
        value: "app/ai/models/ventilator_risk_v1.tflite"
